schema_version = "1.0.0"

id = "paradise_blender"
version = "0.1.0"
name = "Paradise Engine Tools"
tagline = "Author, play, and live-preview Paradise Engine scenes from Blender"
maintainer = "Paradise Engine"
type = "add-on"

website = "https://github.com/ParadiseEngine/ParadiseEngine"

tags = ["Import-Export", "Pipeline", "Game Engine"]

# 4.2 is where the extension system landed; developed against 5.1.
blender_version_min = "4.2.0"

license = ["SPDX:MIT"]

# The addon shells out to `paradise-runtime` (play + live preview), Blender's own glTF
# exporter for mesh GLBs, and optionally `toktx` and the navmesh bridge CLI. Subprocess
# execution and loopback sockets both require full permissions in the extension sandbox.
[permissions]
files = "Read and write scene/material/mesh data under the project data directory"
network = "Loopback connection to the Paradise runtime for live preview"

[build]
paths_exclude_pattern = [
  "__pycache__/",
  "/.git/",
  "/tests/",
  "/tools/",
  "/docs/",
  "/.ruff_cache/",
  "/.pytest_cache/",
  "*.blend1",
]
